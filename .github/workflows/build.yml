name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything must compile (main + test sources) on every OS / JDK we claim to support.
  # The pom compiles with --release 21, so JDK 25 also checks against the Java 21 API.
  compile:
    name: compile (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Compile main and test sources
        shell: bash
        run: ./mvnw -B -ntp test-compile

  # Full build with tests. Needs Docker for Testcontainers, so Linux only.
  verify:
    name: verify (ubuntu-latest, JDK 25)
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify

  # The Dockerfile is what actually ships: make sure every module's image still builds.
  docker:
    name: docker (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        module: [ledger-service, receipt-service, notification-service, statement-service, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MODULE=${{ matrix.module }}
          push: false
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
