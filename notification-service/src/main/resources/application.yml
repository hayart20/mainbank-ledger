spring:
  application:
    name: notification-service
  datasource:
    # own schema in the shared Postgres: currentSchema puts it first on the search_path for every connection
    url: jdbc:postgresql://localhost:5432/mainbank_db?currentSchema=notification
    username: asb_app
    password: SecurePassword123!
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    schemas: notification
    create-schemas: true
  jackson:
    default-property-inclusion: non_null
  kafka:
    # host listener of docker-compose (the app container uses SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092)
    bootstrap-servers: localhost:29092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
    listener:
      concurrency: 3

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

notification:
  kafka:
    topic: ledger.transfer.completed
