spring:
  application:
    name: mainbank-ledger
  datasource:
    url: jdbc:postgresql://localhost:5432/mainbank_db
    username: asb_app
    password: SecurePassword123!
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  kafka:
    # host listener of docker-compose (the app container uses SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092)
    bootstrap-servers: localhost:29092
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # the send runs on the request thread right after commit: never let a dead broker stall the response
        max.block.ms: 2000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: mainbank-ledger-receipts
      auto-offset-reset: earliest
    listener:
      concurrency: 3

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

minio:
  endpoint: http://localhost:9000
  # Host used inside pre-signed URLs - must be reachable by the API client, not just by the app
  public-endpoint: ${minio.endpoint}
  access-key: minioadmin
  secret-key: minioadminpassword
  bucket: transaction-receipts
  region: us-east-1
  presign-ttl: 15m
  # upload/download must never hang a receipt thread: limit for one HTTP request (no internal retries)
  attempt-timeout: 10s

ledger:
  kafka:
    transfer-completed-topic: ledger.transfer.completed
  # CBA compliance: single-transaction ceiling per transfer (in transfer currency units)
  max-transfer-amount: 100000000.00
  # max wait for any row lock (accounts, idempotency key) before the request fails fast with 503 LOCK_TIMEOUT
  lock-timeout: 5s
  receipt:
    max-attempts: 5
    retry-interval: PT30S
    retry-min-age: 20s
