services:
  postgres:
    image: postgres:15-alpine
    container_name: asb-postgres
    environment:
      POSTGRES_DB: mainbank_db
      POSTGRES_USER: asb_app
      POSTGRES_PASSWORD: SecurePassword123!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asb_app -d mainbank_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # The spec image (minio/minio:RELEASE.2023-09-04...) is no longer pullable from Docker Hub/Quay.
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    container_name: asb-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      # no curl in this image: raw HTTP probe over bash /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf \"GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n\" >&3 && read -r line <&3 && [[ $$line == *200* ]]"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: ${MINIO_MC_IMAGE:-cgr.dev/chainguard/minio-client:latest}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_myminio: http://minioadmin:minioadminpassword@minio:9000
    # Bucket stays PRIVATE: receipts are served only through 15-minute pre-signed URLs.
    command: ["mb", "--ignore-existing", "myminio/transaction-receipts"]

  kafka:
    # single-node KRaft broker (no ZooKeeper). INTERNAL = other containers, EXTERNAL = tools on the host.
    image: ${KAFKA_IMAGE:-apache/kafka:3.8.0}
    container_name: asb-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # ledger-service: accounts, transfers, double-entry ledger; publishes ledger.transfer.completed
  app:
    build:
      context: .
      args:
        MODULE: ledger-service
        PORT: "8080"
    container_name: asb-backend-app
    # container limit: the JVM sizes its heap from this (MaxRAMPercentage), not from the whole Docker VM
    mem_limit: 1g
    environment:
      # heap = 55% of the container limit; the rest is for metaspace, threads, code cache and direct buffers
      JAVA_OPTS: "-XX:MaxRAMPercentage=55"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mainbank_db
      SPRING_DATASOURCE_USERNAME: asb_app
      SPRING_DATASOURCE_PASSWORD: SecurePassword123!
      MINIO_ENDPOINT: http://minio:9000
      # pre-signed URLs are opened by the client on the host, not inside the compose network
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # receipt-service: Kafka consumer of ledger.transfer.completed; builds the PDF, stores it in MinIO, serves it
  receipt-service:
    build:
      context: .
      args:
        MODULE: receipt-service
        PORT: "8081"
    container_name: asb-receipt-service
    # container limit: the JVM sizes its heap from this (MaxRAMPercentage), not from the whole Docker VM
    mem_limit: 640m
    environment:
      # heap = 55% of the container limit; the rest is for metaspace, threads, code cache and direct buffers
      JAVA_OPTS: "-XX:MaxRAMPercentage=55"
      # own schema ("receipt") in the shared database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mainbank_db?currentSchema=receipt
      SPRING_DATASOURCE_USERNAME: asb_app
      SPRING_DATASOURCE_PASSWORD: SecurePassword123!
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # start after the ledger so its schema exists when the one-off receipt import runs
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # notification-service: Kafka consumer; tells the account holders about every completed transfer
  notification-service:
    build:
      context: .
      args:
        MODULE: notification-service
        PORT: "8082"
    container_name: asb-notification-service
    # container limit: the JVM sizes its heap from this (MaxRAMPercentage), not from the whole Docker VM
    mem_limit: 512m
    environment:
      # heap = 55% of the container limit; the rest is for metaspace, threads, code cache and direct buffers
      JAVA_OPTS: "-XX:MaxRAMPercentage=55"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mainbank_db?currentSchema=notification
      SPRING_DATASOURCE_USERNAME: asb_app
      SPRING_DATASOURCE_PASSWORD: SecurePassword123!
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # statement-service: Kafka consumer; keeps a read model of account activity and serves statements
  statement-service:
    build:
      context: .
      args:
        MODULE: statement-service
        PORT: "8083"
    container_name: asb-statement-service
    # container limit: the JVM sizes its heap from this (MaxRAMPercentage), not from the whole Docker VM
    mem_limit: 640m
    environment:
      # heap = 55% of the container limit; the rest is for metaspace, threads, code cache and direct buffers
      JAVA_OPTS: "-XX:MaxRAMPercentage=55"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mainbank_db?currentSchema=statement
      SPRING_DATASOURCE_USERNAME: asb_app
      SPRING_DATASOURCE_PASSWORD: SecurePassword123!
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # api-gateway: the only service published to the host (:8080); routes /api/v1 to the services above
  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
        PORT: "8080"
    container_name: asb-api-gateway
    # container limit: the JVM sizes its heap from this (MaxRAMPercentage), not from the whole Docker VM
    mem_limit: 512m
    ports:
      - "8080:8080"
    environment:
      # heap = 55% of the container limit; the rest is for metaspace, threads, code cache and direct buffers
      JAVA_OPTS: "-XX:MaxRAMPercentage=55"
      GATEWAY_LEDGER_URL: http://app:8080
      GATEWAY_RECEIPT_URL: http://receipt-service:8081
      GATEWAY_STATEMENT_URL: http://statement-service:8083
      # no route (the notification service has no API), only used by GET /api/v1/system/status
      GATEWAY_NOTIFICATION_URL: http://notification-service:8082
    depends_on:
      app:
        condition: service_healthy
      receipt-service:
        condition: service_healthy
      statement-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  pgdata:
  miniodata:
  kafkadata:
