spring:
  application:
    name: statement-service
  datasource:
    # own schema in the shared Postgres: currentSchema puts it first on the search_path for every connection
    url: jdbc:postgresql://localhost:5432/mainbank_db?currentSchema=statement
    username: asb_app
    password: SecurePassword123!
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    schemas: statement
    create-schemas: true
  jackson:
    default-property-inclusion: non_null
  kafka:
    # host listener of docker-compose (the app container uses SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092)
    bootstrap-servers: localhost:29092
    consumer:
      group-id: statement-service
      auto-offset-reset: earliest
    listener:
      concurrency: 3

server:
  port: 8083
  shutdown: graceful
  # the gateway forwards the public host (X-Forwarded-*): the OpenAPI "servers" entry and redirects use it
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

statement:
  kafka:
    topic: ledger.transfer.completed
