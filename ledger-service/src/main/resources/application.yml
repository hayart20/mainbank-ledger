spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://localhost:5432/mainbank_db
    username: asb_app
    password: SecurePassword123!
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  kafka:
    # host listener of docker-compose (the app container uses SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092)
    bootstrap-servers: localhost:29092
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # the outbox relay waits for the acknowledgement: bound it so a dead broker only delays events
        max.block.ms: 5000
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

ledger:
  kafka:
    transfer-completed-topic: ledger.transfer.completed
  # CBA compliance: single-transaction ceiling per transfer (in transfer currency units)
  max-transfer-amount: 100000000.00
  # max wait for any row lock (accounts, idempotency key) before the request fails fast with 503 LOCK_TIMEOUT
  lock-timeout: 5s
  outbox:
    # how often committed transfers are relayed to Kafka; published rows are removed after the retention
    poll-interval: 500ms
    retention: 7d
    cleanup-interval: 1h
